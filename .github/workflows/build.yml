name: Build DragonArena.dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone ImGui
      run: |
        rm -rf Sources/imgui
        git clone --depth 1 --branch v1.88 https://github.com/ocornut/imgui Sources/imgui
        # Inject cmath before anything else in every imgui header that uses math
        for f in Sources/imgui/imgui.h Sources/imgui/imgui_internal.h; do
          echo '#include <cmath>' | cat - "$f" > /tmp/_imgui_patch && mv /tmp/_imgui_patch "$f"
        done

    - name: Clone fishhook
      run: |
        rm -rf Sources/fishhook
        git clone --depth 1 https://github.com/facebook/fishhook Sources/fishhook
        cp Sources/fishhook/fishhook.h Sources/
        cp Sources/fishhook/fishhook.c Sources/

    - name: Build dylib
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        CLANG=$(xcrun -f clang++)

        # Compile imgui cpp files as plain c++ (not objc++) so -include works cleanly
        $CLANG -arch arm64 -isysroot "$SDK" -mios-version-min=14.0 \
          -std=c++17 -fvisibility=hidden -O2 \
          -DIMGUI_DEFINE_MATH_OPERATORS \
          -I Sources/imgui \
          -include cmath \
          -c Sources/imgui/imgui.cpp         -o /tmp/imgui.o
        $CLANG -arch arm64 -isysroot "$SDK" -mios-version-min=14.0 \
          -std=c++17 -fvisibility=hidden -O2 \
          -DIMGUI_DEFINE_MATH_OPERATORS \
          -I Sources/imgui \
          -include cmath \
          -c Sources/imgui/imgui_draw.cpp    -o /tmp/imgui_draw.o
        $CLANG -arch arm64 -isysroot "$SDK" -mios-version-min=14.0 \
          -std=c++17 -fvisibility=hidden -O2 \
          -DIMGUI_DEFINE_MATH_OPERATORS \
          -I Sources/imgui \
          -include cmath \
          -c Sources/imgui/imgui_tables.cpp  -o /tmp/imgui_tables.o
        $CLANG -arch arm64 -isysroot "$SDK" -mios-version-min=14.0 \
          -std=c++17 -fvisibility=hidden -O2 \
          -DIMGUI_DEFINE_MATH_OPERATORS \
          -I Sources/imgui \
          -include cmath \
          -c Sources/imgui/imgui_widgets.cpp -o /tmp/imgui_widgets.o

        # Compile imgui metal backend as objc++
        $CLANG -arch arm64 -isysroot "$SDK" -mios-version-min=14.0 \
          -std=c++17 -ObjC++ -fvisibility=hidden -O2 \
          -DIMGUI_DEFINE_MATH_OPERATORS \
          -I Sources/imgui \
          -include cmath \
          -c Sources/imgui/backends/imgui_impl_metal.mm -o /tmp/imgui_metal.o

        # Link everything into the dylib
        $CLANG \
          -arch arm64 \
          -isysroot "$SDK" \
          -mios-version-min=14.0 \
          -std=c++17 \
          -ObjC++ \
          -fvisibility=hidden \
          -O2 \
          -DTARGET_OS_IPHONE=1 \
          -DFISHHOOK_AVAILABLE=1 \
          -DIMGUI_DEFINE_MATH_OPERATORS \
          -I Sources \
          -I Sources/imgui \
          -dynamiclib \
          -framework Foundation \
          -framework Metal \
          -framework MetalKit \
          -framework UIKit \
          -framework CoreGraphics \
          -install_name @rpath/DragonArena.dylib \
          -o DragonArena.dylib \
          Sources/main.mm \
          Sources/fishhook.c \
          /tmp/imgui.o \
          /tmp/imgui_draw.o \
          /tmp/imgui_tables.o \
          /tmp/imgui_widgets.o \
          /tmp/imgui_metal.o

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DragonArena-dylib
        path: DragonArena.dylib
        retention-days: 7
