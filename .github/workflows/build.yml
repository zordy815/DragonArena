name: DragonArena build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Import signing cert
        env:
          CERT_P12_B64: ${{ secrets.CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          echo "$CERT_P12_B64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" build.keychain

      - name: Build dylib
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          sed -i '' "s/FILL_YOUR_TEAM_ID/$TEAM_ID/" Makefile
          make

      - name: Sign dylib
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: make sign

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DragonArena-dylib
          path: DragonArena.dylib
          retention-days: 7
