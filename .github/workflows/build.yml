name: Build DragonArena.dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone ImGui
      run: |
        rm -rf Sources/imgui
        git clone --depth 1 --branch v1.88 https://github.com/ocornut/imgui Sources/imgui

    - name: Clone fishhook
      run: |
        rm -rf Sources/fishhook
        git clone --depth 1 https://github.com/facebook/fishhook Sources/fishhook
        cp Sources/fishhook/fishhook.h Sources/
        cp Sources/fishhook/fishhook.c Sources/

    - name: Build dylib
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        CLANG=$(xcrun -f clang++)

        $CLANG \
          -arch arm64 \
          -isysroot "$SDK" \
          -mios-version-min=14.0 \
          -std=c++17 \
          -ObjC++ \
          -fvisibility=hidden \
          -O2 \
          -DTARGET_OS_IPHONE=1 \
          -DFISHHOOK_AVAILABLE=1 \
          -DIMGUI_DEFINE_MATH_OPERATORS \
          -include math.h \
          -include stdlib.h \
          -I Sources \
          -I Sources/imgui \
          -dynamiclib \
          -framework Foundation \
          -framework UIKit \
          -framework CoreGraphics \
          -install_name @rpath/DragonArena.dylib \
          -o DragonArena.dylib \
          Sources/main.mm \
          Sources/fishhook.c \
          Sources/imgui/imgui.cpp \
          Sources/imgui/imgui_draw.cpp \
          Sources/imgui/imgui_tables.cpp \
          Sources/imgui/imgui_widgets.cpp

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DragonArena-dylib
        path: DragonArena.dylib
        retention-days: 7
